apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-pvc
  namespace: todo-app

  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: todo-microservices

spec:
  storageClassName: gp2
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 5Gi
