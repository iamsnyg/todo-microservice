apiVersion: v1
kind: Service

metadata:
  name: postgres
  namespace: todo-app

  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: todo-microservices

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP