apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-service
  namespace: todo-app

  labels:
    app.kubernetes.io/name: todo-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: todo-microservices

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: todo-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: todo-microservices

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: todo-service

          image: iamsnyg/todo-service:1.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5001
              protocol: TCP

          env:

            # ==========================================
            # Application
            # ==========================================

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: NODE_ENV

            - name: PORT
              value: "5001"


            # ==========================================
            # PostgreSQL
            # ==========================================

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: TODO_DATABASE_URL


            # ==========================================
            # RabbitMQ
            # ==========================================

            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: RABBITMQ_URL


            # ==========================================
            # API Gateway Authentication
            # ==========================================

            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: GATEWAY_SECRET


          # ==========================================
          # Resources
          # ==========================================

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"


          # ==========================================
          # Readiness Probe
          # ==========================================

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6


          # ==========================================
          # Liveness Probe
          # ==========================================

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3


          # ==========================================
          # Security
          # ==========================================

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL
