apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: todo-app

  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: todo-microservices

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: redis

  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: todo-microservices

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: redis
          image: redis:8-alpine

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          command:
            - redis-server

          args:
            - "--appendonly"
            - "yes"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: redis-storage
              persistentVolumeClaim:
              claimName: redis-pvc
              mountPath: /data

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false

      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc