apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: todo-app

  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: todo-microservices

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: todo-microservices

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: auth-service

          image: iamsnyg/todo-auth-service:1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:

            # ==========================================
            # Application
            # ==========================================

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: NODE_ENV

            - name: PORT
              value: "5000"

            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: CLIENT_URL


            # ==========================================
            # PostgreSQL
            # ==========================================

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: AUTH_DATABASE_URL


            # ==========================================
            # Redis
            # ==========================================

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: REDIS_URL


            # ==========================================
            # RabbitMQ
            # ==========================================

            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: RABBITMQ_URL


            # ==========================================
            # Session
            # ==========================================

            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: SESSION_SECRET

            - name: SESSION_MAX_AGE
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: SESSION_MAX_AGE


            # ==========================================
            # SMTP
            # ==========================================

            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: SMTP_HOST

            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: SMTP_PORT

            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: SMTP_USER

            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: SMTP_PASS


            # ==========================================
            # Logging
            # ==========================================

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: LOG_LEVEL


          # ==========================================
          # Resources
          # ==========================================

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"


          # ==========================================
          # Readiness Probe
          # ==========================================

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6


          # ==========================================
          # Liveness Probe
          # ==========================================

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3


          # ==========================================
          # Security
          # ==========================================

          securityContext:
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL
