services:

  # ==========================================
  # PostgreSQL
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: todo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:8-alpine
    container_name: todo-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================
  # RabbitMQ
  # ==========================================
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: todo-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================
  # Auth Database Migration
  # ==========================================
  auth-migration:
    build:
      context: ../../auth-service
      dockerfile: Dockerfile
      target: dependencies

    container_name: todo-auth-migration

    environment:
      DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_db

    command:
      - npx
      - prisma
      - migrate
      - deploy

    depends_on:
      postgres:
        condition: service_healthy


  # ==========================================
  # Auth Service
  # ==========================================
  auth-service:
    image: todo-auth-service:1.0.0
    container_name: todo-auth-service
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      CLIENT_URL: ${CLIENT_URL}

      DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_db

      REDIS_URL: redis://redis:6379

      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672

      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-604800000}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

      LOG_LEVEL: ${LOG_LEVEL:-info}

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      auth-migration:
        condition: service_completed_successfully


  # ==========================================
  # Todo Database Migration
  # ==========================================
  todo-migration:
    build:
      context: ../../todo-service
      dockerfile: Dockerfile
      target: dependencies

    container_name: todo-migration

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    command:
      - npx
      - prisma
      - migrate
      - deploy

    depends_on:
      postgres:
        condition: service_healthy


  # ==========================================
  # Todo Service
  # ==========================================
  todo-service:
    image: todo-service:1.0.0
    container_name: todo-todo-service
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5001

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672

      GATEWAY_SECRET: ${GATEWAY_SECRET}

    ports:
      - "5001:5001"

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      todo-migration:
        condition: service_completed_successfully


  # ==========================================
  # Notification Database Migration
  # ==========================================
  notification-migration:
    build:
      context: ../../notification-service
      dockerfile: Dockerfile
      target: builder

    container_name: todo-notification-migration

    environment:
      DATABASE_URL: postgresql://notification_user:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db

    command:
      - npx
      - prisma
      - migrate
      - deploy

    depends_on:
      postgres:
        condition: service_healthy


  # ==========================================
  # Notification Service
  # ==========================================
  notification-service:
    image: notification-service:1.0.0
    container_name: todo-notification-service
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5002

      DATABASE_URL: postgresql://notification_user:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db

      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

      MAIL_FROM: ${MAIL_FROM}

    ports:
      - "5002:5002"

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      notification-migration:
        condition: service_completed_successfully


  # ==========================================
  # API Gateway
  # ==========================================
  gateway:
    build:
      context: ../../gateway
      dockerfile: Dockerfile

    container_name: todo-gateway
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 8000

      AUTH_SERVICE_URL: http://auth-service:5000
      TODO_SERVICE_URL: http://todo-service:5001
      NOTIFICATION_SERVICE_URL: http://notification-service:5002

      GATEWAY_SECRET: ${GATEWAY_SECRET}

      CLIENT_URL: ${CLIENT_URL}

    ports:
      - "8000:8000"

    depends_on:
      auth-service:
        condition: service_started

      todo-service:
        condition: service_started

      notification-service:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3



  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://13.206.80.36:8000

    container_name: todo-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

    ports:
      - "3000:3000"

    depends_on:
      gateway:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
